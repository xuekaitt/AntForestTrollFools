name: iOS Build

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ios-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build AntManorPort
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # macos-latest 默认 Xcode 可能随镜像升级；优先选 15.4（iOS 17.5 SDK，支持 iOS 14 最低版本）。
      # 若该版本已从镜像移除，则回退到镜像默认 Xcode，不影响构建。
      - name: Select Xcode 15.x
        id: xcode
        continue-on-error: true
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '15.4'

      - name: Report Xcode fallback
        if: steps.xcode.outcome != 'success'
        run: echo "::warning::Xcode 15.4 不可用，改用镜像默认 Xcode 继续构建"

      - name: Show toolchain
        run: |
          set -euo pipefail
          echo "xcode-select: $(xcode-select -p)"
          xcodebuild -version
          echo "iPhoneOS SDK: $(xcrun --sdk iphoneos --show-sdk-path)"
          echo "target clang: $(xcrun --sdk iphoneos --find clang)"
          clang --version
          lipo -version || true
          sw_vers

      - name: Resolve version
        id: version
        run: |
          set -euo pipefail
          VERSION="$(sed -n 's/^VERSION[[:space:]]*:=[[:space:]]*//p' Makefile | head -n 1 | tr -d '[:space:]')"
          if [ -z "$VERSION" ]; then
            echo "::error::Makefile 中未找到 VERSION"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "构建版本：$VERSION"

      - name: Build dylib
        run: make

      - name: Static self-check
        run: make test

      - name: Install dpkg for deb packaging
        run: |
          set -euo pipefail
          if ! command -v dpkg-deb >/dev/null 2>&1; then
            HOMEBREW_NO_AUTO_UPDATE=1 brew install dpkg
          fi
          if ! command -v dpkg-deb >/dev/null 2>&1; then
            DPKG_PREFIX="$(brew --prefix dpkg 2>/dev/null || true)"
            if [ -n "$DPKG_PREFIX" ] && [ -x "$DPKG_PREFIX/bin/dpkg-deb" ]; then
              export PATH="$DPKG_PREFIX/bin:$PATH"
              echo "$DPKG_PREFIX/bin" >> "$GITHUB_PATH"
            fi
          fi
          if command -v dpkg-deb >/dev/null 2>&1; then
            dpkg-deb --version
          else
            echo "::warning::dpkg-deb 不可用，package.sh 将回退到 ar + tar"
          fi

      # 打包失败不阻塞构建：至少保留 dylib 产物。
      - name: Package deb and TrollFools zip
        id: package
        continue-on-error: true
        run: make package

      - name: Report packaging result
        run: |
          if [ "${{ steps.package.outcome }}" != "success" ]; then
            echo "::warning::make package 失败，仅上传 dylib 产物"
          fi

      - name: Upload dylib
        uses: actions/upload-artifact@v4
        with:
          name: AntManorPort-${{ steps.version.outputs.version }}-build${{ github.run_number }}-dylib
          path: build/*.dylib
          retention-days: 30
          if-no-files-found: error

      - name: Upload packages
        if: steps.package.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: AntManorPort-${{ steps.version.outputs.version }}-build${{ github.run_number }}-packages
          path: |
            dist/*.deb
            dist/*-TrollFools.zip
          retention-days: 30
          if-no-files-found: warn

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          fail_on_unmatched_files: false
          files: |
            build/*.dylib
            dist/*.deb
            dist/*-TrollFools.zip
